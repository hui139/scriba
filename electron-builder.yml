appId: io.github.scriba
productName: Scriba
copyright: Copyright © 2026 Scriba Contributors
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - plugins/**/*
  - package.json
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Scriba
mac:
  icon: build/icon.png
  target:
    - dmg
  category: public.app-category.productivity
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Office
